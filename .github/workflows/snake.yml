name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF41&color_dots=#0d1117,#0a3d1a,#0f7a2e,#14b840,#00FF41&color_stroke=#00FF41
            dist/github-contribution-grid-snake.gif?color_snake=#00FF41&color_dots=#0d1117,#0a3d1a,#0f7a2e,#14b840,#00FF41&color_stroke=#00FF41

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
