<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d2c17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>
  <circle cx="70" cy="80" r="62" fill="url(#bg)" stroke="#00FF41" stroke-width="1.5" opacity="0.9"/>
  <g filter="url(#glow)" fill="none" stroke="#00FF41" stroke-width="4">
    <circle cx="70" cy="80" r="46" stroke-width="3.5"/>
    <circle cx="70" cy="18" r="4" fill="#0d1117" stroke-width="2"/>
    <circle cx="70" cy="142" r="4" fill="#0d1117" stroke-width="2"/>
    <circle cx="8" cy="80" r="4" fill="#0d1117" stroke-width="2"/>
    <circle cx="132" cy="80" r="4" fill="#0d1117" stroke-width="2"/>
    <line x1="70" y1="80" x2="70" y2="46" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 70 80" to="360 70 80" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="80" x2="98" y2="80" stroke-linecap="round" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 70 80" to="360 70 80" dur="60s" repeatCount="indefinite"/>
    </line>
    <circle cx="70" cy="80" r="4.5" fill="#00FF41"/>
  </g>
</svg>
