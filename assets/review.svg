  </defs>
  <circle cx="70" cy="75" r="62" fill="url(#bg)" stroke="#00FF41" stroke-width="1.5" opacity="0.9"/>
  <g filter="url(#glow)" fill="none" stroke="#00FF41" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M28 38 h84 a9 9 0 0 1 9 9 v52 a9 9 0 0 1 -9 9 h-52 l-27 24 v-24 h-5 a9 9 0 0 1 -9 -9 v-52 a9 9 0 0 1 9 -9 z" fill="#0d1117"/>
